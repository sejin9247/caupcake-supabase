<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>근거노트 대시보드</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    color-scheme: light;
    --bg: #f4f6fa; --surface: #ffffff; --surface-2: #eef2f8; --border: #d5deea;
    --text: #1d2330; --text-2: #52596a; --muted: #7a8292; --accent: #1c3d6e;
    --series-1: #2a78d6; --series-2: #eb6834; --cap: #1d2330;
    --err: #c1121f; --ok: #0f7a3d;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #121417; --surface: #1a1c20; --surface-2: #23262c; --border: #33373f;
      --text: #f2f3f5; --text-2: #c3c6cd; --muted: #8d93a0; --accent: #9dbdf0;
      --series-1: #3987e5; --series-2: #d95926; --cap: #f2f3f5;
      --err: #ff6b6b; --ok: #4cc27e;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif; }
  main { max-width: 1080px; margin: 0 auto; padding: 20px 16px 48px; }
  header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  h1 { font-size: 22px; margin: 0 0 2px; color: var(--accent); }
  h2 { font-size: 15px; margin: 0; color: var(--accent); }
  .sub { color: var(--text-2); font-size: 12.5px; margin: 0 0 16px; }
  .lang { display: inline-flex; border: 1px solid var(--border); border-radius: 999px; overflow: hidden; flex: none; background: var(--surface); }
  .lang button { font: inherit; font-size: 12.5px; border: 0; background: transparent; color: var(--text-2); padding: 5px 12px; cursor: pointer; }
  .lang button[aria-pressed="true"] { background: var(--accent); color: var(--surface); font-weight: 600; }
  .box { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 14px; }
  .head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .grid2 { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 14px; align-items: start; }
  .grid2 > .box { margin-bottom: 0; }
  .tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; min-width: 0; }
  .tile .k { font-size: 12px; color: var(--text-2); }
  .tile .v { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile .n { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* region picker */
  .pickers { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
  .picker { position: relative; flex: 1 1 260px; min-width: 0; }
  .picker label { align-items: flex-start; }
  .picker label i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
  .picker input { width: 100%; }
  .picker ul { position: absolute; left: 0; right: 0; top: 100%; margin: 4px 0 0; padding: 4px; list-style: none; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 6px 20px rgba(0,0,0,.18); max-height: 280px; overflow-y: auto; z-index: 20; }
  .picker li { padding: 6px 8px; border-radius: 5px; cursor: pointer; display: flex; justify-content: space-between; gap: 10px; font-size: 13px; }
  .picker li small { color: var(--muted); white-space: nowrap; }
  .picker li[aria-selected="true"], .picker li:hover { background: var(--surface-2); }
  .picker .none { color: var(--muted); cursor: default; }
  label { display: flex; flex-direction: column; font-size: 12px; font-weight: 600; color: var(--accent); gap: 3px; }
  .wide { grid-column: 1 / -1; }
  input { font: inherit; color: var(--text); background: var(--surface); padding: 7px 9px; border: 1px solid var(--border); border-radius: 6px; min-width: 0; }
  form.f { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 10px; }
  .btn { font: inherit; padding: 7px 14px; border: 1px solid var(--accent); background: var(--accent); color: var(--surface); border-radius: 6px; cursor: pointer; white-space: nowrap; }
  .btn.ghost { background: transparent; color: var(--accent); }
  .btn[aria-pressed="true"] { background: var(--accent); color: var(--surface); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .seg button { font: inherit; font-size: 12px; border: 0; background: var(--surface); color: var(--text-2); padding: 5px 10px; cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--border); }
  .seg button[aria-pressed="true"] { background: var(--surface-2); color: var(--text); font-weight: 600; }
  .status { font-size: 12px; color: var(--text-2); min-height: 1.2em; margin-top: 6px; }
  .status.err { color: var(--err); }
  .status.ok { color: var(--ok); }
  .note { font-size: 11.5px; color: var(--muted); margin: 8px 0 0; }
  /* chart */
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--text-2); margin-bottom: 8px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  .legend i.cap { width: 2px; height: 12px; background: var(--cap); border-radius: 0; vertical-align: -2px; }
  .chart { position: relative; }
  .grp { display: grid; grid-template-columns: 150px minmax(0, 1fr); align-items: center; gap: 8px; padding: 3px 0; border-radius: 4px; outline: none; }
  .grp:hover, .grp:focus-visible { background: var(--surface-2); }
  .grp-label { font-size: 12px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-left: 4px; }
  .grp:hover .grp-label { color: var(--text); }
  .bars { position: relative; display: flex; flex-direction: column; gap: 2px; min-height: 9px; }
  .bar { height: 9px; border-radius: 0 4px 4px 0; min-width: 2px; }
  .one .bar { height: 14px; }
  .bar.s1 { background: var(--series-1); }
  .bar.s2 { background: var(--series-2); }
  .bar.none { background: transparent; min-width: 0; }
  .capmark { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--cap); }
  .axis { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 8px; font-size: 11px; color: var(--muted); margin-top: 4px; }
  .axis div:last-child { display: flex; justify-content: space-between; border-top: 1px solid var(--border); padding-top: 2px; }
  .tip { position: absolute; pointer-events: none; background: var(--text); color: var(--bg); font-size: 12px; padding: 7px 9px; border-radius: 6px; width: 260px; opacity: 0; transition: opacity .1s; z-index: 5; }
  .tip .r { display: flex; justify-content: space-between; gap: 10px; }
  .tip .r span:last-child { font-variant-numeric: tabular-nums; font-weight: 600; }
  /* table */
  .tbl-wrap { overflow: auto; max-height: 520px; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--text-2); font-weight: 600; background: var(--surface-2); position: sticky; top: 0; z-index: 1; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  td.src { color: var(--text-2); min-width: 260px; }
  td.nowrap { white-space: nowrap; }
  mark { background: color-mix(in srgb, var(--series-2) 30%, transparent); color: inherit; border-radius: 2px; }
  tr.new td { background: color-mix(in srgb, var(--series-1) 12%, transparent); }
  @media (max-width: 820px) {
    .grid2 { grid-template-columns: 1fr; }
    .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    form.f { grid-template-columns: 1fr; }
    .grp, .axis { grid-template-columns: 104px minmax(0, 1fr); }
  }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1 data-i18n="title">근거노트 대시보드</h1>
      <p class="sub" data-i18n="sub"></p>
    </div>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="ko" aria-pressed="true">한국어</button>
      <button type="button" data-lang="it" aria-pressed="false">Italiano</button>
    </div>
  </header>

  <section class="box">
    <div class="pickers">
      <div class="picker" id="pickA">
        <label for="inA"><span><i style="background:var(--series-1)"></i> <span data-i18n="regionA">지역 검색</span></span></label>
        <input id="inA" role="combobox" aria-expanded="false" aria-autocomplete="list" autocomplete="off" data-i18n-ph="phRegion">
        <ul role="listbox" hidden></ul>
      </div>
      <button class="btn ghost" type="button" id="btnCompare" aria-pressed="false" data-i18n="compare">비교해 보기</button>
      <div class="picker" id="pickB" hidden>
        <label for="inB"><span><i style="background:var(--series-2)"></i> <span data-i18n="regionB">비교할 지역 검색</span></span></label>
        <input id="inB" role="combobox" aria-expanded="false" aria-autocomplete="list" autocomplete="off" data-i18n-ph="phRegionB">
        <ul role="listbox" hidden></ul>
      </div>
    </div>
    <p class="note" data-i18n="pickNote"></p>
  </section>

  <div class="tiles">
    <div class="tile"><div class="k" data-i18n="kRegions">검색 가능한 지역</div><div class="v" id="tRegions">–</div><div class="n" data-i18n="nRegions"></div></div>
    <div class="tile"><div class="k" data-i18n="kRows">선택 지역 근거 행</div><div class="v" id="tRows">–</div><div class="n" id="tRowsN"></div></div>
    <div class="tile"><div class="k" data-i18n="kStrict">상한보다 낮게 정한 항목</div><div class="v" id="tStrict">–</div><div class="n" id="tStrictN"></div></div>
    <div class="tile"><div class="k" data-i18n="kEff">조례 시행일</div><div class="v" id="tEff">–</div><div class="n" id="tEffN"></div></div>
  </div>

  <div class="grid2">
    <section class="box">
      <div class="head">
        <h2 id="chartTitle"></h2>
        <div class="seg" role="group">
          <button type="button" data-metric="용적률" aria-pressed="true" data-i18n="far">용적률</button>
          <button type="button" data-metric="건폐율" aria-pressed="false" data-i18n="bcr">건폐율</button>
        </div>
      </div>
      <div class="legend" id="legend"></div>
      <div class="chart" id="chart"></div>
      <div class="axis" id="axis"></div>
      <div class="tip" id="tip" role="tooltip"></div>
      <p class="note" data-i18n="chartNote"></p>
    </section>

    <section class="box">
      <div class="head"><h2 data-i18n="formTitle">새 근거값 저장</h2></div>
      <p class="note" style="margin:0 0 10px" data-i18n="formNote"></p>
      <form class="f" id="f">
        <label class="wide"><span data-i18n="fRegion">지역 (region)</span><input name="region" maxlength="60" data-i18n-ph="phFRegion"></label>
        <label class="wide"><span data-i18n="fItem">항목 (item)</span><input name="item" required maxlength="100" data-i18n-ph="phItem"></label>
        <label><span data-i18n="fValue">값 (value, 숫자만)</span><input name="value" type="number" step="any" required placeholder="1"></label>
        <label><span data-i18n="fUnit">단위 (unit)</span><input name="unit" required maxlength="30" data-i18n-ph="phUnit"></label>
        <label class="wide"><span data-i18n="fSource">출처 (source)</span><input name="source" required minlength="5" maxlength="300" data-i18n-ph="phSource"></label>
        <label><span data-i18n="fDate">조회일 (queried_on)</span><input name="queried_on" type="date" required></label>
        <div class="wide"><button class="btn" type="submit" id="btnSave" data-i18n="save">저장</button><div class="status" id="formStatus"></div></div>
      </form>
    </section>
  </div>

  <section class="box" style="margin-top:14px">
    <div class="head">
      <h2><span data-i18n="listTitle">근거 행</span> <span id="listCount" style="color:var(--text-2);font-weight:400"></span></h2>
      <div class="row">
        <div class="seg" role="group">
          <button type="button" data-scope="sel" aria-pressed="true" data-i18n="scopeSel">선택 지역</button>
          <button type="button" data-scope="all" aria-pressed="false" data-i18n="scopeAll">모든 지역</button>
        </div>
        <input id="q" type="search" data-i18n-ph="phSearch" style="width:220px">
      </div>
    </div>
    <div class="status" id="listStatus"></div>
    <div class="tbl-wrap">
      <table>
        <thead><tr><th data-i18n="cRegion">지역</th><th data-i18n="cItem">항목</th><th style="text-align:right" data-i18n="cValue">값</th><th data-i18n="cUnit">단위</th><th data-i18n="cSource">출처</th><th data-i18n="cDate">조회일</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </section>
</main>

    phSource: "Portale Toji-eum · indirizzo della particella · fonte primaria/secondaria",
    listTitle: "Righe", scopeSel: "Regioni scelte", scopeAll: "Tutte le regioni", phSearch: "Cerca voce o fonte (es. 상업, 제61조)",
    cRegion: "Regione", cItem: "Voce", cValue: "Valore", cUnit: "Unità", cSource: "Fonte", cDate: "Consultato il",
    searching: "Ricerca sul server…", found: (n, ms, more) => `Risposta del server: ${n} righe${more ? " (mostrate le prime 300)" : ""} · ${ms} ms`,
    empty: "Nessuna riga corrisponde.", noRegion: "Nessuna regione trovata.",
    loadFail: m => `Caricamento non riuscito: ${m}`, saving: "Salvataggio…", saveFail: m => `Salvataggio non riuscito: ${m}`,
    saved: (id, t) => `Salvato · id ${id} · ${t} — deve restare nell'elenco anche dopo il ricaricamento.`,
    need4: "Compila valore, unità, fonte e data.", tipCap: "Limite di legge", rows: "righe",
  },
};
const ZONE_IT = {
  "제1종전용주거지역": "Resid. esclusiva 1ª cl.", "제2종전용주거지역": "Resid. esclusiva 2ª cl.",
  "제1종일반주거지역": "Resid. generale 1ª cl.", "제2종일반주거지역": "Resid. generale 2ª cl.",
  "제3종일반주거지역": "Resid. generale 3ª cl.", "준주거지역": "Semi-residenziale",
  "중심상업지역": "Commerciale centrale", "일반상업지역": "Commerciale generale", "근린상업지역": "Commerciale di vicinato",
  "유통상업지역": "Commerciale distributiva", "전용공업지역": "Industriale esclusiva", "일반공업지역": "Industriale generale",
  "준공업지역": "Semi-industriale", "보전녹지지역": "Verde di conservazione", "생산녹지지역": "Verde produttiva",
  "자연녹지지역": "Verde naturale", "보전관리지역": "Gestione conservativa", "생산관리지역": "Gestione produttiva",
  "계획관리지역": "Gestione pianificata", "농림지역": "Agricola e forestale", "자연환경보전지역": "Tutela ambientale",
};

// 한글 → 로마자(개정 로마자 표기의 음절 단위 근사) — 이탈리아어 화면의 지역명 표시용
const RR_I = ["g","kk","n","d","tt","r","m","b","pp","s","ss","","j","jj","ch","k","t","p","h"];
const RR_V = ["a","ae","ya","yae","eo","e","yeo","ye","o","wa","wae","oe","yo","u","wo","we","wi","yu","eu","ui","i"];
const RR_F = ["","k","k","k","n","n","n","t","l","k","m","l","l","l","p","l","m","p","p","t","t","ng","t","t","k","t","p","t"];
function romanizeWord(w) {
  let out = "";
  for (const ch of w) {
    const c = ch.charCodeAt(0) - 0xac00;
    if (c < 0 || c > 11171) { out += ch; continue; }
    out += RR_I[Math.floor(c / 588)] + RR_V[Math.floor((c % 588) / 28)] + RR_F[c % 28];
  }
  return out;
}
function romanizeRegion(r) {
  if (r === CAP_REGION) return "Nazionale (limite del Decreto attuativo)";
  return r.split(" ").map(w => {
    const m = w.match(/^(.+?)(특별자치시|특별자치도|특별시|광역시|시|군|구|도)$/);
    const base = m ? romanizeWord(m[1]) + "-" + romanizeWord(m[2]) : romanizeWord(w);
    return base.charAt(0).toUpperCase() + base.slice(1);
  }).join(" ");
}

let lang = "ko";
try { const s = localStorage.getItem("lang"); if (s === "it" || s === "ko") lang = s; } catch {}
const T = () => I18N[lang];
const metricName = m => m === "용적률" ? T().far : T().bcr;
const tZone = z => lang === "ko" ? z : (ZONE_IT[z] || z);
const tRegion = r => lang === "ko" ? r : `${romanizeRegion(r)}`;
const shortRegion = r => r === CAP_REGION ? T().capLegend : lang === "ko" ? r.split(" ").pop() : romanizeRegion(r).split(" ").pop();
function tItem(item) {
  if (lang === "ko") return item;
  const m = item.match(/^(\S+) (용적률|건폐율)$/);
  return m && ZONE_IT[m[1]] ? `${ZONE_IT[m[1]]} · ${metricName(m[2])}` : item;
}
function tSource(s) {
  if (lang === "ko") return s;
  return s
    .replace(/국토의 계획 및 이용에 관한 법률 시행령/g, "Decreto attuativo della Legge sulla pianificazione del territorio")
    .replace(/(\S+?) ?(도시|군|도시[·ㆍ]군)계획 ?조례/g, (_, city) => `Regolamento urbanistico di ${romanizeRegion(city)}`)
    .replace(/제(\d+)조의(\d+)/g, "art. $1-$2").replace(/제(\d+)조/g, "art. $1").replace(/제(\d+)항/g, " c. $1").replace(/제(\d+)호/g, " n. $1")
    .replace(/범위 ([\d~]+) 중 상한/g, "limite superiore dell'intervallo $1").replace(/상한/g, "limite superiore")
    .replace(/자치법규ID\/일련번호/g, "ID regolamento / n. serie").replace(/시행 /g, "in vigore dal ")
    .replace(/2차자료/g, "fonte secondaria").replace(/1차자료/g, "fonte primaria")
    .replace(/국가법령정보/g, "Centro nazionale di informazione legislativa").replace(/대조/g, "verificato")
    .replace(/(\S)\(/g, "$1 (");
}

// ---------- 공통 ----------
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const fmt = n => Number(n).toLocaleString(lang === "it" ? "it-IT" : "ko-KR");
const clean = q => q.replace(/[,()*%\\"]/g, " ").trim();
function setStatus(el, msg, kind = "") { el.textContent = msg; el.className = "status" + (kind ? " " + kind : ""); }

let regionA = DEFAULT_REGION, regionB = null, compare = false, metric = "용적률", scope = "sel";
let cache = new Map(), regionCount = 0, lastNewId = null, lastResult = null;

async function regionRows(region) {
  if (cache.has(region)) return cache.get(region);
  const { data, error } = await db.from("evidence").select("id, region, item, value, unit, source, queried_on").eq("region", region).order("id");
  if (error) throw error;
  cache.set(region, data); return data;
}

// ---------- 지역 검색 콤보박스 (입력할 때마다 서버 검색) ----------
function makePicker(root, onPick) {
  const input = root.querySelector("input"), ul = root.querySelector("ul");
  let items = [], active = -1, seq = 0, timer = null;
  const close = () => { ul.hidden = true; input.setAttribute("aria-expanded", "false"); active = -1; };
  const draw = () => {
    ul.innerHTML = items.length ? items.map((r, i) => `<li role="option" data-i="${i}" aria-selected="${i === active}">
      <span>${esc(tRegion(r.region))}${lang === "it" ? ` <small>${esc(r.region)}</small>` : ""}</span><small>${fmt(r.n)} ${T().rows}</small></li>`).join("")
      : `<li class="none">${T().noRegion}</li>`;
    ul.hidden = false; input.setAttribute("aria-expanded", "true");
  };
  async function query() {
    const my = ++seq, q = clean(input.value);
    let req = db.from("evidence_regions").select("region, n").order("region").limit(40);
    if (q) req = req.ilike("region", `%${q}%`);
    const { data, error } = await req;
    if (my !== seq || error) return;
    items = data; active = data.length ? 0 : -1; draw();
  }
  const pick = i => { const r = items[i]; if (!r) return; input.value = tRegion(r.region); close(); onPick(r.region); };
  input.addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(query, 150); });
  input.addEventListener("focus", () => { input.select(); query(); });
  input.addEventListener("keydown", e => {
    if (ul.hidden && e.key === "ArrowDown") return query();
    if (e.key === "ArrowDown") { active = Math.min(active + 1, items.length - 1); draw(); e.preventDefault(); }
    else if (e.key === "ArrowUp") { active = Math.max(active - 1, 0); draw(); e.preventDefault(); }
    else if (e.key === "Enter") { e.preventDefault(); pick(active); }
    else if (e.key === "Escape") close();
  });
  ul.addEventListener("mousedown", e => { const li = e.target.closest("li[data-i]"); if (li) { e.preventDefault(); pick(+li.dataset.i); } });
  input.addEventListener("blur", () => setTimeout(close, 100));
  return { set: r => input.value = r ? tRegion(r) : "" };
}
const pickerA = makePicker($("pickA"), r => { regionA = r; form.region.value = r; refresh(); });
const pickerB = makePicker($("pickB"), r => { regionB = r; refresh(); });

$("btnCompare").addEventListener("click", () => {
  compare = !compare;
  $("btnCompare").setAttribute("aria-pressed", compare);
  $("btnCompare").textContent = compare ? T().compareOff : T().compare;
  $("pickB").hidden = !compare;
  if (compare && !regionB) setTimeout(() => $("inB").focus(), 0);
  refresh();
});

// ---------- 요약 + 차트 ----------
async function refresh() {
  try {
    const [a, cap, b] = await Promise.all([regionRows(regionA), regionRows(CAP_REGION), compare && regionB ? regionRows(regionB) : null]);
    renderTiles(a, cap); renderChart(a, b, cap); search();
  } catch (e) { setStatus($("listStatus"), T().loadFail(e.message), "err"); }
}
const byZone = (rows, m) => {
  const out = {};
  for (const r of rows || []) { const x = r.item.match(/^(\S+) (용적률|건폐율)$/); if (x && x[2] === m && r.unit === "%") out[x[1]] = r; }
  return out;
};
function renderTiles(a, cap) {
  $("tRegions").textContent = fmt(regionCount);
  const std = a.filter(r => /^(\S+) (용적률|건폐율)$/.test(r.item));
  $("tRows").textContent = fmt(a.length); $("tRowsN").textContent = T().rowsN(std.length);
  const capMap = Object.fromEntries(cap.map(r => [r.item, +r.value]));
  const comparable = std.filter(r => capMap[r.item] !== undefined);
  const strict = comparable.filter(r => +r.value < capMap[r.item]);
  $("tStrict").textContent = regionA === CAP_REGION ? "–" : fmt(strict.length);
  $("tStrictN").textContent = T().strictN(comparable.length);
  const eff = (a.map(r => (r.source.match(/시행 (\d{4}-\d{2}-\d{2})/) || [])[1]).filter(Boolean).sort().at(-1)) || "–";
  $("tEff").textContent = eff; $("tEffN").textContent = shortRegion(regionA);
}
function renderChart(a, b, cap) {
  $("chartTitle").textContent = T().chartTitle(metricName(metric));
  const A = byZone(a, metric), B = b ? byZone(b, metric) : null, C = byZone(cap, metric);
  const two = !!B;
  $("legend").innerHTML = `<span><i style="background:var(--series-1)"></i>${esc(tRegion(regionA))}</span>`
    + (two ? `<span><i style="background:var(--series-2)"></i>${esc(tRegion(regionB))}</span>` : "")
    + `<span><i class="cap"></i>${esc(T().capLegend)}</span>`;
  const max = Math.max(1, ...ZONES.flatMap(z => [A[z], B?.[z], C[z]].filter(Boolean).map(r => +r.value)));
  const pct = v => (v / max * 100).toFixed(2) + "%";
  const bar = (r, s) => r ? `<div class="bar ${s}" style="width:${pct(r.value)}"></div>` : `<div class="bar none"></div>`;
  $("chart").innerHTML = ZONES.map((z, i) => `
    <div class="grp ${two ? "" : "one"}" tabindex="0" data-i="${i}">
      <div class="grp-label" title="${esc(tZone(z))}">${esc(tZone(z))}</div>
      <div class="bars">${bar(A[z], "s1")}${two ? bar(B[z], "s2") : ""}
        ${C[z] ? `<div class="capmark" style="left:calc(${pct(C[z].value)} - 1px)"></div>` : ""}</div>
    </div>`).join("");
  $("axis").innerHTML = `<div></div><div><span>0</span><span>${fmt(Math.round(max / 2))}</span><span>${fmt(max)} %</span></div>`;
  const tip = $("tip"), box = $("chart").parentElement;
  $("chart").querySelectorAll(".grp").forEach(el => {
    const z = ZONES[+el.dataset.i];
    const line = (label, r) => `<div class="r"><span>${esc(label)}</span><span>${r ? fmt(r.value) + " %" : "–"}</span></div>`;
    const show = () => {
      tip.innerHTML = `<b>${esc(tZone(z))}</b>${line(shortRegion(regionA), A[z])}${two ? line(shortRegion(regionB), B[z]) : ""}${line(T().tipCap, C[z])}`;
      const r1 = el.getBoundingClientRect(), r2 = box.getBoundingClientRect();
      tip.style.left = Math.max(8, Math.min(r1.left - r2.left + 160, r2.width - 268)) + "px";
      tip.style.top = (r1.bottom - r2.top + 4) + "px"; tip.style.opacity = 1;
    };
    const hide = () => tip.style.opacity = 0;
    el.addEventListener("mouseenter", show); el.addEventListener("focus", show);
    el.addEventListener("mouseleave", hide); el.addEventListener("blur", hide);
  });
}
document.querySelectorAll("[data-metric]").forEach(btn => btn.addEventListener("click", () => {
  metric = btn.dataset.metric;
  document.querySelectorAll("[data-metric]").forEach(x => x.setAttribute("aria-pressed", x === btn));
  refresh();
}));

// ---------- 행 검색: 입력할 때마다 서버 검색 ----------
let seq = 0, timer = null;
async function search() {
  const my = ++seq, q = clean($("q").value);
  setStatus($("listStatus"), T().searching);
  const t0 = performance.now();
  let req = db.from("evidence").select("id, region, item, value, unit, source, queried_on", { count: "exact" }).order("id", { ascending: false }).limit(300);
  if (scope === "sel") req = req.in("region", compare && regionB ? [regionA, regionB] : [regionA]);
  if (q) req = req.or(`item.ilike.*${q}*,source.ilike.*${q}*,region.ilike.*${q}*`);
  const { data, error, count } = await req;
  if (my !== seq) return;
  if (error) return setStatus($("listStatus"), T().loadFail(error.message), "err");
  setStatus($("listStatus"), T().found(fmt(count ?? data.length), Math.round(performance.now() - t0), (count ?? 0) > data.length));
  renderTable({ rows: data, q, count });
}
function hl(text, q) {
  const s = esc(text); if (!q) return s;
  const e = esc(q).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  return s.replace(new RegExp(e, "gi"), m => `<mark>${m}</mark>`);
}
function renderTable(res) {
  lastResult = res; if (!res) return;
  const { rows, q, count } = res;
  $("listCount").textContent = `${fmt(count ?? rows.length)}`;
  $("tbody").innerHTML = rows.length ? rows.map(r => `
    <tr class="${r.id === lastNewId ? "new" : ""}">
      <td class="nowrap">${hl(r.region ? shortRegion(r.region) : "–", q)}</td><td>${hl(tItem(r.item), q)}</td><td class="num">${fmt(r.value)}</td><td>${esc(r.unit)}</td>
      <td class="src">${hl(tSource(r.source), q)}</td><td class="nowrap">${esc(r.queried_on)}</td>
    </tr>`).join("") : `<tr><td colspan="6" style="color:var(--muted)">${T().empty}</td></tr>`;
}
$("q").addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(search, 200); });
document.querySelectorAll("[data-scope]").forEach(btn => btn.addEventListener("click", () => {
  scope = btn.dataset.scope;
  document.querySelectorAll("[data-scope]").forEach(x => x.setAttribute("aria-pressed", x === btn));
  search();
}));

// ---------- 저장 (insert → .select()로 새 행 받기) ----------
const form = $("f");
const today = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
form.queried_on.value = today; form.queried_on.max = today; form.region.value = regionA;
form.addEventListener("submit", async e => {
  e.preventDefault();
  const fd = new FormData(form);
  const row = { region: fd.get("region").trim() || null, item: fd.get("item").trim(), value: Number(fd.get("value")),
                unit: fd.get("unit").trim(), source: fd.get("source").trim(), queried_on: fd.get("queried_on") };
  if (!row.item || !row.unit || row.source.length < 5 || !Number.isFinite(row.value))
    return setStatus($("formStatus"), T().need4, "err");
  $("btnSave").disabled = true; setStatus($("formStatus"), T().saving);
  const { data, error } = await db.from("evidence").insert(row).select("id, created_at").single();
  $("btnSave").disabled = false;
  if (error) return setStatus($("formStatus"), T().saveFail(error.message), "err");
  lastNewId = data.id;
  setStatus($("formStatus"), T().saved(data.id, new Date(data.created_at).toLocaleString(lang === "it" ? "it-IT" : "ko-KR")), "ok");
  const keepRegion = row.region || "";
  form.reset(); form.queried_on.value = today; form.region.value = keepRegion;
  if (row.region) cache.delete(row.region);
  refresh();
});

// ---------- 언어 ----------
function applyLang() {
  document.documentElement.lang = lang;
  document.title = T().title;
  document.querySelectorAll("[data-i18n]").forEach(el => { const v = T()[el.dataset.i18n]; if (typeof v === "string") el.textContent = v; });
  document.querySelectorAll("[data-i18n-ph]").forEach(el => el.placeholder = T()[el.dataset.i18nPh]);
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));
  $("btnCompare").textContent = compare ? T().compareOff : T().compare;
  pickerA.set(regionA); pickerB.set(regionB);
}
document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => {
  lang = b.dataset.lang; try { localStorage.setItem("lang", lang); } catch {}
  applyLang(); refresh();
}));

(async () => {
  applyLang();
  const { count } = await db.from("evidence_regions").select("region", { count: "exact", head: true });
  regionCount = count || 0;
  refresh();
})();
</script>
